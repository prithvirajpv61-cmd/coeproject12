{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="auth-mark">SB</div>
  <h1>Reset your password</h1>
  <p class="auth-sub">Enter a new secure password for your account.</p>

  <form method="POST" action="{{ url_for('reset_password') }}" novalidate>
    <input type="hidden" name="token" value="{{ token }}">

    <div class="field">
      <label for="new_password">New Password</label>
      <div class="input-with-icon">
        <input type="password" id="new_password" name="new_password" placeholder="At least 6 characters" required minlength="6" autofocus>
        <button type="button" class="password-toggle-btn" aria-label="Show password" data-toggle-target="new_password">
          <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
        </button>
      </div>
      <div class="hint">Minimum 6 characters</div>
    </div>

    <div class="field">
      <label for="confirm_password">Confirm New Password</label>
      <div class="input-with-icon">
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your new password" required minlength="6">
        <button type="button" class="password-toggle-btn" aria-label="Show password" data-toggle-target="confirm_password">
          <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
        </button>
      </div>
    </div>

    <button type="submit" class="btn btn-primary btn-block">Reset Password</button>
  </form>

  <p class="auth-switch"><a href="{{ url_for('login') }}">← Back to Login</a></p>
</div>
{% endblock %}
