{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
<div class="welcome-block">
  <div class="eyebrow">Profile</div>
  <h1>My profile</h1>
  <p>Only your login details live here — business information is never stored on your profile.</p>
</div>

<div class="profile-grid">
  <div class="profile-card">
    <h3>Account details</h3>
    <form method="POST" action="{{ url_for('profile') }}">
      <input type="hidden" name="action" value="update_info">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" value="{{ user.name }}" required>
      </div>
      <div class="field">
        <label for="email_display">Email</label>
        <input type="email" id="email_display" value="{{ user.email }}" disabled>
      </div>
      <div class="field">
        <label for="mobile">Mobile</label>
        <input type="tel" id="mobile" name="mobile" value="{{ user.mobile or '' }}">
      </div>
      <button type="submit" class="btn btn-primary">Save changes</button>
    </form>
  </div>

  <div class="profile-card">
    <h3>Change password</h3>
    <form method="POST" action="{{ url_for('profile') }}">
      <input type="hidden" name="action" value="change_password">
      <div class="field">
        <label for="current_password">Current password</label>
        <div class="input-with-icon">
          <input type="password" id="current_password" name="current_password" required>
          <button type="button" class="password-toggle-btn" aria-label="Show password" data-toggle-target="current_password">
            <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
          </button>
        </div>
      </div>
      <div class="field">
        <label for="new_password">New password</label>
        <div class="input-with-icon">
          <input type="password" id="new_password" name="new_password" required minlength="6">
          <button type="button" class="password-toggle-btn" aria-label="Show password" data-toggle-target="new_password">
            <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-outline">Change password</button>
    </form>
  </div>
</div>
{% endblock %}
