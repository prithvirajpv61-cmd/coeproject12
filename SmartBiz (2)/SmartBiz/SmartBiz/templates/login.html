{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="auth-mark">SB</div>
  <h1>Welcome back 👋</h1>
  <p class="auth-sub">Log in to find and compare government loan schemes for your business.</p>

  <form method="POST" action="{{ url_for('login') }}" novalidate>
    <div class="field">
      <label for="identifier">Email Address or Mobile Number</label>
      <input type="text" id="identifier" name="identifier" value="{{ identifier or '' }}" placeholder="Enter registered email or mobile" required autofocus>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="input-with-icon">
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
        <button type="button" class="password-toggle-btn" aria-label="Show password" data-toggle-target="password">
          <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
        </button>
      </div>
    </div>

    <div class="field-actions">
      <a href="{{ url_for('forgot_password') }}" class="forgot-link">Forgot Password?</a>
    </div>

    <button type="submit" class="btn btn-primary btn-block">Log in</button>
  </form>

  <p class="auth-switch">Don't have an account? <a href="{{ url_for('register') }}">Create Account</a></p>
</div>
{% endblock %}
